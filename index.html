<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Enzo Leduc</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #93BDAC;
            margin: 0;
            padding: 0;
        }

        /* Barre de navigation */
        .navbar {
            background-color: #2c3e50;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-item {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .nav-item:hover { background-color: #34495e; }
        .nav-item.active { background-color: #3498db; }

        .ma-photo {
            width: 250px;       
            height: auto;       
            border-radius: 12px; 
            margin-top: 30px; 
        }

        .container {
            max-width: 650px;
            margin: 30px auto 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .form-ajout {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        #btnAjouter {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        #btnAjouter:hover { background-color: #2980b9; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
        }

        tr:hover { background-color: #f8fafc; }

        .vide {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }

        /* NOUVEAUTÉ : Style du bouton de suppression rouge */
        .btn-supprimer {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-supprimer:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-item active">👥 Liste Élèves</a>
        <a href="agenda.html" class="nav-item">📅 Mon Agenda</a>
    </nav>

    <h1>Salut</h1>
    <p>Tu viens souvent ici? Grrr</p>

<div class="container">
    <h1>📋 Liste des élèves</h1>

    <div class="form-ajout">
        <input type="text" id="prenom" placeholder="Prénom de l'élève">
        <input type="text" id="nom" placeholder="Nom de l'élève">
        <button id="btnAjouter">➕ Ajouter</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Action</th> <!-- AJOUT : Troisième colonne pour le bouton -->
            </tr>
        </thead>
        <tbody id="corpsTableau">
            <!-- Les lignes s'ajouteront ici en JavaScript -->
        </tbody>
    </table>
</div>

<script src="bouton.js"></script>

</body>
</html>
